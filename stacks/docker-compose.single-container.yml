# Single-container deployment: backend API + frontend SPA in one image
# Usage: docker compose -f stacks/docker-compose.single-container.yml up -d

services:
  mytube:
    image: ${MYTUBE_SINGLE_IMAGE:-ghcr.io/franklioxygen/mytube:latest}
    pull_policy: always
    container_name: mytube
    ports:
      - "5551:5551"
    volumes:
      # Override MYTUBE_UPLOADS_DIR / MYTUBE_DATA_DIR to relocate host data
      # while preserving the current defaults for existing deployments.
      - ${MYTUBE_UPLOADS_DIR:-../uploads}:/app/uploads
      - ${MYTUBE_DATA_DIR:-../data}:/app/data
    environment:
      - PORT=5551
      # Optional: match the backend process uid/gid to the host-side file ownership.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Set to 0 to disable the startup chown pass for bind-mounted data/uploads.
      - MYTUBE_AUTO_FIX_PERMISSIONS=${MYTUBE_AUTO_FIX_PERMISSIONS:-1}
      # Optional: declare the admin trust boundary for this deployment.
      # Valid values: application | container | host
      # Docs: documents/en/deployment-security-model.md
      - MYTUBE_ADMIN_TRUST_LEVEL=container
    restart: unless-stopped
    # Avoid Chromium/Puppeteer stalls on hosts with half-enabled IPv6.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

  # Optional: TorrServer for magnet "watch while downloading" streaming.
  # Both services share Compose's default network, so the mytube backend reaches
  # TorrServer at http://torrserver:8090. Enable it and set that base URL under
  # Settings > Library > TorrServer. Delete this service to opt out.
  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: mytube-torrserver
    command: ["--port", "8090", "--path", "/ts-data"]
    volumes:
      - torrserver-data:/ts-data
    restart: unless-stopped

volumes:
  torrserver-data:
    driver: local
